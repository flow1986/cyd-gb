[platformio]
build_dir = build
default_envs = esp32dev_sender

[env:esp32dev_sender]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D USE_HSPI_PORT
    -D TOUCH_CS=33
    -D TOUCH_IRQ=36
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_CLK=25

lib_deps =
    bodmer/TFT_eSPI@^2.5.33
    robtillaart/PCF8574@^0.4.1
    https://github.com/flow1986/fake-cyd-gui-kit.git

extra_scripts =
    post:scripts/timestamp_firmware.py

build_src_filter =
    +<sender/>
    -<main.cpp>
    -<apps/>
